name: iOS Simulator Build

# No Apple Developer account configured, so this can't produce a real
# signed .ipa installable on a physical iPhone (Apple requires a paid
# account + certificate + provisioning profile for that, not something CI
# can work around). This builds unsigned for the iOS Simulator instead —
# enough to confirm the Capacitor/Xcode project actually builds, and to
# run it in Simulator.app locally if you have a Mac to open it on.
#
# Run manually from the Actions tab ("Run workflow") — not on every push,
# since a macOS runner is slower and there's no need to build iOS on every
# desktop/Android-only change.

on:
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Zip the simulator app bundle
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r JellyWave-simulator.zip App.app

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: JellyWave-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/JellyWave-simulator.zip
          retention-days: 14
